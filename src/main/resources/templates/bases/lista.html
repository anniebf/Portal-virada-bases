<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Atualizações das Bases - Portal DEV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            padding: 40px 20px;
        }
        .container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header-title {
            font-size: 28px;
            color: #0d6efd;
            font-weight: 600;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        .header-title i {
            margin-right: 10px;
        }
        .table thead th {
            background-color: #0d6efd;
            color: white;
            text-align: center;
        }
        .table tbody td {
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title"><i class="bi bi-database-check"></i> Atualizações das Bases</h1>

        <table class="table table-hover table-striped">
            <thead>
                <tr>
                    <th>Base</th>
                    <th>Última Atualização</th>
                    <th>Próxima Atualização</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="base : ${bases}">
                    <td th:text="${base.nomeBase}"></td>
                    <td th:text="${base.ultimaAtualizacao}"></td>
                    <td th:text="${base.proximaAtualizacao}"></td>

                </tr>
            </tbody>
        </table>
    </div>

    <!-- Ícones Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
