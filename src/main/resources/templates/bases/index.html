<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Virada das Bases - Portal DEV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- Adicione Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Volkhov:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">

    <!-- CSS inline temporário para diagnóstico -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f6;
            color: #333;
            padding: 0;
        }

        /* ====== Header ====== */
        header {
            display: flex;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        header img {
            height: 50px;
            margin-right: 15px;
        }

        header h1 {
            font-size: 28px;
            color: #2a7f4f;
            margin: 0;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        header h1 i {
            margin-right: 10px;
            color: #2a7f4f;
        }

        /* Botão Voltar */
        .btn-voltar {
            display: block;
            background-color: #2a7f4f;
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-voltar:hover {
            background-color: #1f5e3b;
            transform: translateY(-1px);
            color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.12);
        }

        /* ------------------ Estilo da tabela ------------------ */
        .table-container {
            margin: 0 100px;
            border: 2px solid #2a7f4f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0;
        }

        .table thead th {
            background: linear-gradient(#00a46b, #01c681);
            color: white;
            text-align: center;
            padding: 15px;
            border: none;
            font-weight: 600;
            font-size: 16px;
        }

        .table tbody td {
            text-align: center;
            vertical-align: middle;
            padding: 12px 15px;
            border: none;
            border-bottom: 1px solid #e9ecef;
        }

        /* Estilo para table-striped */
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(42, 127, 79, 0.05);
        }

        /* Estilo para table-hover */
        .table-hover tbody tr:hover {
            background-color: rgba(42, 127, 79, 0.1);
        }

        .table tbody tr.selected {
            background-color: #2a7f4f;
            color: white;
        }

        .table tbody tr.selected:hover {
            background-color: #247045;
            color: white;
        }

        /* ------------------ Responsividade ------------------ */
        @media (max-width: 992px) {
            .table-container {
                margin: 0 50px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            header h1 {
                font-size: 22px;
                justify-content: center;
            }

            .btn-voltar {
                margin-top: 10px;
            }

            .table-container {
                margin: 0 20px;
            }

            .table thead th {
                padding: 10px 8px;
                font-size: 14px;
            }

            .table tbody td {
                padding: 10px 8px;
                font-size: 14px;
            }
        }

        @media (max-width: 576px) {
            .table-container {
                margin: 0 10px;
            }

            header h1 {
                font-size: 18px;
                flex-direction: column;
                gap: 5px;
            }

            header h1 i {
                margin-right: 0;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
<header>
    <img th:src="@{/img/logo_bf.png}" alt="logo_bf">
    <h1><i class="bi bi-database-check"></i> Virada das Bases</h1>
    <a href="/" class="btn-voltar">Voltar</a>
</header>

<div class="table-container">
    <table class="table table-hover table-striped">
        <thead>
        <tr>
            <th>Base</th>
            <th>Última Atualização</th>
            <th>Próxima Atualização</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="base : ${bases}">
            <td th:text="${base.nomeBase}"></td>
            <td th:text="${base.ultimaAtualizacao}"></td>
            <td th:text="${base.proximaAtualizacao}"></td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
