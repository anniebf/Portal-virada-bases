<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Virada das Bases - Portal DEV</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">

</head>
<body>
<div class="table-container">
    <img th:src="@{/img/logo_bf.png}" alt="logo_bf" class="logo_bf">
    <h1 class="header-title"><i class="bi bi-database-check"></i> Virada das Bases</h1>

    <table class="table table-hover table-striped">
        <thead>
        <tr>
            <th>Base</th>
            <th>Última Atualização</th>
            <th>Próxima Atualização</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="base : ${bases}">
            <td th:text="${base.nomeBase}"></td>
            <td th:text="${base.ultimaAtualizacao}"></td>
            <td th:text="${base.proximaAtualizacao}"></td>

        </tr>

        </tbody>
    </table>
</div>
<script th:src="@{/../static/js/script.js}"></script>
</body>
</html>
